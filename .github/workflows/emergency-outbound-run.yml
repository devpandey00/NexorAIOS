name: Nexor emergency outbound run

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  outbound:
    if: contains(github.event.head_commit.message, 'emergency-outbound')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run outbound workers against production
        env:
          NEXOR_BASE_URL: https://nexoraios-main-1.vercel.app
        run: |
          set -euo pipefail
          fetch_token() {
            curl --silent --show-error --max-time 15 \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nexoraios-production" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }
          call() {
            local name="$1" url="$2" method="${3:-GET}" body="${4:-}" file code token
            token="$(fetch_token)"
            file="$(mktemp)"
            if [[ "$method" == "POST" ]]; then
              code="$(curl --silent --show-error --retry 2 --retry-delay 2 --retry-all-errors --max-time 120 -o "$file" -w '%{http_code}' -H "X-Nexor-Machine-Token: $token" -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -X POST "$NEXOR_BASE_URL$url" --data "$body")"
            else
              code="$(curl --silent --show-error --retry 2 --retry-delay 2 --retry-all-errors --max-time 120 -o "$file" -w '%{http_code}' -H "X-Nexor-Machine-Token: $token" -H "Authorization: Bearer $token" "$NEXOR_BASE_URL$url")"
            fi
            echo "=== $name [$code] ==="
            cat "$file"; echo
            rm -f "$file"
            [[ "$code" =~ ^2[0-9][0-9]$ ]]
          }
          for cycle in 1 2 3; do
            echo "### outbound cycle $cycle"
            call whatsapp_generate /api/whatsapp/automation-worker POST '{"action":"generate","limit":20}' || true
            call whatsapp_pending /api/whatsapp/automation/pending || true
            call whatsapp_send /api/whatsapp/automation-worker POST '{"action":"run_due","limit":20}' || true
            call followups /api/cron/followups || true
            call outreach /api/cron/outreach || true
            if [[ "$cycle" -lt 3 ]]; then sleep 300; fi
          done
