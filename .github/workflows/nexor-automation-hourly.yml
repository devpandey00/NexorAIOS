name: NexorAIOS · Hourly Automation

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: nexor-automation-hourly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Autopilot
        run: |
          curl --fail-with-body --silent --show-error --max-time 300 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.NEXOR_BASE_URL }}/api/cron/autopilot"
      - name: Follow-ups
        run: |
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.NEXOR_BASE_URL }}/api/cron/followups"
