name: Nexor production outbound worker
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  id-token: write
  contents: read
concurrency:
  group: nexor-production-outbound-worker
  cancel-in-progress: true
jobs:
  outbound:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run production outbound cycle
        env:
          NEXOR_BASE_URL: https://nexoraios-main-1.vercel.app
        run: |
          set -euo pipefail
          failures=0
          fetch_token() {
            curl --silent --show-error --fail --max-time 15 \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nexoraios-production" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }
          call() {
            local name="$1" url="$2" method="${3:-GET}" body="${4:-}" file code token
            token="$(fetch_token)"
            file="$(mktemp)"
            if [[ "$method" == "POST" ]]; then
              code="$(curl --silent --show-error --retry 2 --retry-delay 2 --retry-all-errors --max-time 120 -o "$file" -w '%{http_code}' -H "X-Nexor-Machine-Token: $token" -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -X POST "$NEXOR_BASE_URL$url" --data "$body")"
            else
              code="$(curl --silent --show-error --retry 2 --retry-delay 2 --retry-all-errors --max-time 120 -o "$file" -w '%{http_code}' -H "X-Nexor-Machine-Token: $token" -H "Authorization: Bearer $token" "$NEXOR_BASE_URL$url")"
            fi
            echo "=== $name [$code] ==="
            cat "$file"
            echo
            if [[ ! "$code" =~ ^2[0-9][0-9]$ ]]; then
              failures=$((failures+1))
              rm -f "$file"
              return 1
            fi
            rm -f "$file"
          }

          # WhatsApp generation is allowed to fail without blocking the other outbound lanes.
          call whatsapp_generate /api/whatsapp/automation-worker POST '{"action":"generate","limit":20}' || echo 'WARN: whatsapp_generate failed'

          approval_token="$(fetch_token)"
          approval_file="$(mktemp)"
          approval_code="$(curl --silent --show-error --retry 2 --retry-delay 2 --retry-all-errors --max-time 60 -o "$approval_file" -w '%{http_code}' -H "X-Nexor-Machine-Token: $approval_token" -H "Authorization: Bearer $approval_token" "$NEXOR_BASE_URL/api/whatsapp/automation/pending")"
          echo "=== whatsapp_pending [$approval_code] ==="
          cat "$approval_file"
          echo
          if [[ "$approval_code" =~ ^2[0-9][0-9]$ ]]; then
            approval_state="$(python - "$approval_file" <<'PY'
          import json,sys
          try:
              data=json.load(open(sys.argv[1]))
              provider=data.get('provider') or {}
              ids=[x.get('id') for x in data.get('drafts',[]) if isinstance(x,dict) and x.get('id')]
              print(json.dumps({'ids':ids,'automationReady':bool(provider.get('automationReady'))}))
          except Exception:
              print(json.dumps({'ids':[],'automationReady':False}))
          PY
          )"
            approval_ids="$(python -c 'import json,sys; print(json.dumps(json.loads(sys.argv[1]).get("ids",[])))' "$approval_state")"
            approval_ready="$(python -c 'import json,sys; print("true" if json.loads(sys.argv[1]).get("automationReady") else "false")' "$approval_state")"
            if [[ "$approval_ids" != "[]" && "$approval_ready" == "true" ]]; then
              call whatsapp_approve /api/whatsapp/automation-worker POST "{\"action\":\"approve\",\"ids\":$approval_ids}" || echo 'WARN: whatsapp_approve failed'
            fi
          else
            failures=$((failures+1))
            echo 'ERROR: whatsapp_pending did not return 2xx'
          fi
          rm -f "$approval_file"

          call whatsapp_send /api/whatsapp/automation-worker POST '{"action":"run_due","limit":20}' || echo 'WARN: whatsapp_send failed'
          call social_publish /api/cron/social-publish || echo 'ERROR: social_publish failed'
          call followups /api/cron/followups || echo 'WARN: followups failed'
          call outreach_auto_approve /api/cron/outreach-approve || echo 'WARN: outreach_auto_approve failed'
          call outreach /api/cron/outreach || echo 'WARN: outreach failed'

          echo "worker_failures=$failures"
          if [[ "$failures" -gt 0 ]]; then
            exit 1
          fi
