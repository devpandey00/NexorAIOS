name: one-time qualification repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'fix(discovery): stop rejecting valid business names') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Relax over-broad business-name filter
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/api/src/lib/campaign-runner.ts')
          s = p.read_text()
          old = "function looksLikeNonBusinessName(name: string): boolean { return [/\\bbest\\b/i,/\\btop\\b/i,/\\blist\\b/i,/\\bdirectory\\b/i,/\\bguide\\b/i,/\\broundup\\b/i,/\\barticles?\\b/i,/\\bhow to\\b/i,/\\bstrategy\\b/i,/\\bpatients?\\b/i,/\\bget \\d+x\\b/i,/\\bcompanies\\b/i].some((pattern) => pattern.test(name)); }"
          new = "function looksLikeNonBusinessName(name: string): boolean { return [/^\\s*(?:best|top)\\s+\\d+/i,/\\b(?:directory|directories|jobs?|careers?|vacanc(?:y|ies)|news|articles?|guide|roundup)\\b/i,/\\bhow to\\b/i].some((pattern) => pattern.test(name)); }"
          if old not in s:
              print('qualification filter already repaired or source changed; nothing to do')
              raise SystemExit(0)
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/lib/campaign-runner.ts
          git commit -m 'fix(discovery): stop rejecting valid business names'
          git push origin main
      - name: Remove one-time repair workflow
        run: |
          git rm .github/workflows/one-time-qualification-repair.yml
          git commit -m 'chore: remove one-time qualification repair workflow'
          git push origin main
