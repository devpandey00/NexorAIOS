name: NexorAIOS · Morning / Midday / Evening Reports

on:
  schedule:
    # GitHub cron is UTC. These run at 09:00, 15:00 and 21:00 IST.
    - cron: '30 3,9,15 * * *'
  workflow_dispatch:

concurrency:
  group: nexor-reporting
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Send operational report
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "03" ]; then PERIOD=12; LABEL="Morning Brief"; \
          elif [ "$HOUR" = "09" ]; then PERIOD=6; LABEL="Midday Report"; \
          else PERIOD=24; LABEL="Evening / Daily Close"; fi
          echo "Sending $LABEL ($PERIOD hour window)"
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.NEXOR_BASE_URL }}/api/cron/reports/email?hours=$PERIOD"
