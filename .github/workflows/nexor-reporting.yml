name: NexorAIOS · 2h Reports

on:
  schedule:
    # GitHub cron is UTC. Every 2 hours, year-round.
    - cron: '0 */2 * * *'
  workflow_dispatch:

concurrency:
  group: nexor-reporting
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Send 2-hour operational report
        run: |
          echo "Sending NexorAIOS 2-hour report"
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.NEXOR_BASE_URL }}/api/cron/reports/email?hours=2"
