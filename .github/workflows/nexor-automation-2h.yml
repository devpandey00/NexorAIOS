name: NexorAIOS · 2h Prospecting

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

concurrency:
  group: nexor-automation-2h
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run canonical 2-hour prospecting workflow
        env:
          NEXOR_BASE_URL: ${{ secrets.NEXOR_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$NEXOR_BASE_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$NEXOR_BASE_URL/api/cron/autopilot"
