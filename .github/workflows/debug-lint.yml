name: Debug Lint Output

on:
  push:
    branches: [fix/sales-stabilization-final]

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Capture lint output
        run: |
          set +e
          pnpm install --no-frozen-lockfile --fix-lockfile > /tmp/install.log 2>&1
          pnpm db:generate >> /tmp/install.log 2>&1
          pnpm lint > lint-output.txt 2>&1
          status=$?
          echo "LINT_EXIT_CODE=$status" >> lint-output.txt
          exit 0
      - name: Commit lint output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lint-output.txt
          git commit -m 'chore(ci): capture lint diagnostics'
          git push origin HEAD:fix/sales-stabilization-final
