name: One-time schema repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'devpandey00'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate Job.lead relation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/database/prisma/schema.prisma')
          text = p.read_text()
          needle = '  lead     Lead?     @relation(fields: [leadId], references: [id], onDelete: Cascade)\n'
          if text.count(needle) < 2:
              print('No duplicate relation found; nothing to repair.')
              raise SystemExit(0)
          first = text.find(needle)
          second = text.find(needle, first + len(needle))
          text = text[:second] + text[second + len(needle):]
          p.write_text(text)
          print('Removed duplicate Job.lead relation.')
          PY
      - name: Commit repair
        run: |
          if git diff --quiet -- packages/database/prisma/schema.prisma; then
            echo 'No repair commit required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/database/prisma/schema.prisma
          git commit -m 'fix(database): remove duplicate Job lead relation'
          git push
