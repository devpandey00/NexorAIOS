name: Repair campaign lead upsert
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair invalid composite upsert
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/api/src/lib/campaign-runner.ts')
          s = p.read_text()
          old = "where: { campaignId_leadId: lead.id }, create: { campaignId, leadId: lead.id }, update: {}"
          new = "where: { campaignId_leadId: { campaignId, leadId: lead.id } }, create: { campaignId, leadId: lead.id }, update: {}"
          if old not in s:
              raise SystemExit('expected invalid composite upsert not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/lib/campaign-runner.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(build): repair campaign lead composite upsert'
          git push