name: Nexor automation worker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: nexor-automation-worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run outreach, follow-ups and social publishing
        env:
          NEXOR_BASE_URL: ${{ vars.NEXOR_PRODUCTION_URL || 'https://nexoraios-main-1.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          for path in /api/cron/outreach /api/cron/followups /api/cron/social-publish; do
            echo "Running $path"
            curl --fail-with-body --silent --show-error --max-time 120 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$NEXOR_BASE_URL$path"
            echo
          done
