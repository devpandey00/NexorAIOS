name: Nexor automation worker

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: nexor-automation-worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run durable automation scheduler
        env:
          NEXOR_BASE_URL: https://nexoraios-main-1.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET" || { echo 'CRON_SECRET is required'; exit 1; }
          body_file="$(mktemp)"
          http_code="$(curl --fail-with-body --silent --show-error --max-time 120 \
            -o "$body_file" -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -X POST \
            "$NEXOR_BASE_URL/api/automations/run")"
          cat "$body_file"
          echo
          rm -f "$body_file"
          if [[ ! "$http_code" =~ ^2[0-9][0-9]$ ]]; then
            echo "Automation scheduler returned HTTP $http_code; refusing to treat redirect/error as success."
            exit 1
          fi

      - name: Run outreach, follow-ups and social publishing
        env:
          NEXOR_BASE_URL: https://nexoraios-main-1.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET" || { echo 'CRON_SECRET is required'; exit 1; }

          call_worker() {
            local path="$1"
            local body_file
            body_file="$(mktemp)"
            echo "Running $path"
            http_code="$(curl --fail-with-body --silent --show-error --max-time 120 \
              -o "$body_file" -w '%{http_code}' \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$NEXOR_BASE_URL$path")"
            cat "$body_file"
            echo
            rm -f "$body_file"
            if [[ ! "$http_code" =~ ^2[0-9][0-9]$ ]]; then
              echo "Worker $path returned HTTP $http_code; refusing to treat redirect/error as success."
              exit 1
            fi
          }

          call_worker /api/cron/outreach
          call_worker /api/cron/followups
          call_worker /api/cron/social-publish
