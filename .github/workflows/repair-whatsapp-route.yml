name: Repair WhatsApp automation route

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix WhatsApp route syntax
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/api/src/app/api/whatsapp/automation/route.ts')
          s = p.read_text()
          old = 'error:null}}));return NextResponse.json'
          new = 'error:null}})));return NextResponse.json'
          if old not in s:
              raise SystemExit('Expected broken transaction pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/app/api/whatsapp/automation/route.ts
          git commit -m 'fix(automation): repair WhatsApp transaction syntax'
          git push origin HEAD:main
