name: Nexor lead discovery worker

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: nexor-lead-discovery
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Acquire GitHub OIDC machine token
        id: oidc
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('nexoraios-production');
            core.setOutput('token', token);

      - name: Run one durable discovery job
        env:
          NEXOR_BASE_URL: https://nexoraios-main-1.vercel.app
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          code="$(curl --silent --show-error --retry 2 --retry-delay 3 --retry-all-errors --max-time 320 \
            -o "$response_file" -w '%{http_code}' \
            -H "X-Nexor-Machine-Token: $GITHUB_OIDC_TOKEN" \
            -H "Authorization: Bearer $GITHUB_OIDC_TOKEN" \
            "$NEXOR_BASE_URL/api/cron/campaign-worker")"
          echo "=== campaign-worker [$code] ==="
          cat "$response_file"
          echo
          rm -f "$response_file"
          [[ "$code" =~ ^2[0-9][0-9]$ ]]
