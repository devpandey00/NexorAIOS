name: Nexor lead discovery worker

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: nexor-lead-discovery
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Run one durable discovery job
        env:
          NEXOR_BASE_URL: https://nexoraios-main-1.vercel.app
        run: |
          set -euo pipefail
          token="$(curl --silent --show-error --max-time 15 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nexoraios-production" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          response_file="$(mktemp)"
          code="$(curl --silent --show-error --retry 2 --retry-delay 3 --retry-all-errors --max-time 320 \
            -o "$response_file" -w '%{http_code}' \
            -H "X-Nexor-Machine-Token: $token" \
            -H "Authorization: Bearer $token" \
            "$NEXOR_BASE_URL/api/cron/campaign-worker")"
          echo "=== campaign-worker [$code] ==="
          cat "$response_file"
          echo
          rm -f "$response_file"
          [[ "$code" =~ ^2[0-9][0-9]$ ]]
