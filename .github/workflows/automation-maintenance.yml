name: Nexor scheduled automation

on:
  schedule:
    - cron: '0 */2 * * *'
    - cron: '0 10 * * *'
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'Task to run'
        required: true
        default: 'job-autopilot'
        type: choice
        options:
          - job-autopilot
          - autopilot
          - reports

permissions:
  id-token: write
  contents: read

concurrency:
  group: nexor-scheduled-automation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Select scheduled task
        id: task
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          MANUAL_TASK: ${{ inputs.task || '' }}
        run: |
          set -euo pipefail
          if [ -n "$MANUAL_TASK" ]; then
            task="$MANUAL_TASK"
          else
            case "$EVENT_SCHEDULE" in
              '0 */2 * * *') task="job-autopilot" ;;
              '0 10 * * *') task="autopilot" ;;
              '0 */4 * * *') task="reports" ;;
              *) echo "Unknown schedule: $EVENT_SCHEDULE"; exit 1 ;;
            esac
          fi
          echo "task=$task" >> "$GITHUB_OUTPUT"

      - name: Run scheduled Nexor worker
        env:
          NEXOR_BASE_URL: https://nexoraios-main-1.vercel.app
          TASK: ${{ steps.task.outputs.task }}
        run: |
          set -euo pipefail
          case "$TASK" in
            job-autopilot) path="/api/cron/job-autopilot" ;;
            autopilot) path="/api/cron/autopilot" ;;
            reports) path="/api/cron/reports/email" ;;
            *) echo "Unknown task: $TASK"; exit 1 ;;
          esac
          token="$(curl --silent --show-error --max-time 15 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nexoraios-production" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          body_file="$(mktemp)"
          echo "Running $path"
          http_code="$(curl --silent --show-error --retry 2 --retry-delay 3 --retry-all-errors --max-time 120 \
            -o "$body_file" -w '%{http_code}' \
            -H "X-Nexor-Machine-Token: $token" \
            -H "Authorization: Bearer $token" \
            "$NEXOR_BASE_URL$path")"
          cat "$body_file"
          echo
          rm -f "$body_file"
          if [[ ! "$http_code" =~ ^2[0-9][0-9]$ ]]; then
            echo "Scheduled worker $path returned HTTP $http_code; refusing to treat redirect/error as success."
            exit 1
          fi
