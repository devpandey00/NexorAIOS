name: Nexor scheduled automation

on:
  schedule:
    # Job/opportunity discovery every 2 hours.
    - cron: '0 */2 * * *'
    # Daily autopilot at 10:00 UTC (15:30 IST).
    - cron: '0 10 * * *'
    # Daily report at 13:00 UTC (18:30 IST).
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'Task to run'
        required: true
        default: 'job-autopilot'
        type: choice
        options:
          - job-autopilot
          - autopilot
          - reports

permissions: {}

concurrency:
  group: nexor-scheduled-automation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Select scheduled task
        id: task
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          MANUAL_TASK: ${{ inputs.task || '' }}
        run: |
          set -euo pipefail
          if [ -n "$MANUAL_TASK" ]; then
            task="$MANUAL_TASK"
          else
            case "$EVENT_SCHEDULE" in
              '0 */2 * * *') task="job-autopilot" ;;
              '0 10 * * *') task="autopilot" ;;
              '0 13 * * *') task="reports" ;;
              *) echo "Unknown schedule: $EVENT_SCHEDULE"; exit 1 ;;
            esac
          fi
          echo "task=$task" >> "$GITHUB_OUTPUT"

      - name: Run scheduled Nexor worker
        env:
          NEXOR_BASE_URL: ${{ vars.NEXOR_PRODUCTION_URL || 'https://nexoraios-main-1-diwakarpandeyitwa-3531s-projects.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TASK: ${{ steps.task.outputs.task }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET" || { echo 'CRON_SECRET is required'; exit 1; }
          test -n "$NEXOR_BASE_URL" || { echo 'NEXOR_PRODUCTION_URL is required'; exit 1; }
          case "$TASK" in
            job-autopilot) path="/api/cron/job-autopilot" ;;
            autopilot) path="/api/cron/autopilot" ;;
            reports) path="/api/cron/reports/email" ;;
            *) echo "Unknown task: $TASK"; exit 1 ;;
          esac
          echo "Running $path"
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$NEXOR_BASE_URL$path"
          echo
