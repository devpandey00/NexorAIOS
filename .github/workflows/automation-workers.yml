name: Nexor realtime automation workers

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: nexor-realtime-workers
  cancel-in-progress: false

jobs:
  workers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run automatic campaign discovery
        continue-on-error: true
        env:
          NEXOR_BASE_URL: https://nexoraios-main-1.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET" || { echo 'CRON_SECRET is required'; exit 1; }
          body_file="$(mktemp)"
          echo "Running /api/campaigns/auto/run"
          http_code="$(curl --silent --show-error --max-time 300 -o "$body_file" -w '%{http_code}' -H "Authorization: Bearer $CRON_SECRET" "$NEXOR_BASE_URL/api/campaigns/auto/run")"
          cat "$body_file"
          echo
          rm -f "$body_file"
          if [[ ! "$http_code" =~ ^2[0-9][0-9]$ ]]; then
            echo "Campaign discovery returned HTTP $http_code; continuing so downstream automation workers still run."
            exit 1
          fi

      - name: Run durable Nexor automation scheduler
        continue-on-error: true
        env:
          NEXOR_BASE_URL: https://nexoraios-main-1.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET" || { echo 'CRON_SECRET is required'; exit 1; }
          body_file="$(mktemp)"
          echo "Running /api/automations/run"
          http_code="$(curl --silent --show-error --max-time 120 -o "$body_file" -w '%{http_code}' -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" -X POST "$NEXOR_BASE_URL/api/automations/run")"
          cat "$body_file"
          echo
          rm -f "$body_file"
          if [[ ! "$http_code" =~ ^2[0-9][0-9]$ ]]; then
            echo "Automation scheduler returned HTTP $http_code; continuing so outreach workers still run."
            exit 1
          fi

      - name: Run due follow-ups
        continue-on-error: true
        env:
          NEXOR_BASE_URL: https://nexoraios-main-1.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET" || { echo 'CRON_SECRET is required'; exit 1; }
          body_file="$(mktemp)"
          echo "Running /api/cron/followups"
          http_code="$(curl --silent --show-error --max-time 120 -o "$body_file" -w '%{http_code}' -H "Authorization: Bearer $CRON_SECRET" "$NEXOR_BASE_URL/api/cron/followups")"
          cat "$body_file"
          echo
          rm -f "$body_file"
          if [[ ! "$http_code" =~ ^2[0-9][0-9]$ ]]; then
            echo "Follow-up worker returned HTTP $http_code; continuing."
            exit 1
          fi

      - name: Run due outreach
        continue-on-error: true
        env:
          NEXOR_BASE_URL: https://nexoraios-main-1.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET" || { echo 'CRON_SECRET is required'; exit 1; }
          body_file="$(mktemp)"
          echo "Running /api/cron/outreach"
          http_code="$(curl --silent --show-error --max-time 120 -o "$body_file" -w '%{http_code}' -H "Authorization: Bearer $CRON_SECRET" "$NEXOR_BASE_URL/api/cron/outreach")"
          cat "$body_file"
          echo
          rm -f "$body_file"
          if [[ ! "$http_code" =~ ^2[0-9][0-9]$ ]]; then
            echo "Outreach worker returned HTTP $http_code; continuing."
            exit 1
          fi

      - name: Run due social publishing
        continue-on-error: true
        env:
          NEXOR_BASE_URL: https://nexoraios-main-1.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET" || { echo 'CRON_SECRET is required'; exit 1; }
          body_file="$(mktemp)"
          echo "Running /api/cron/social-publish"
          http_code="$(curl --silent --show-error --max-time 120 -o "$body_file" -w '%{http_code}' -H "Authorization: Bearer $CRON_SECRET" "$NEXOR_BASE_URL/api/cron/social-publish")"
          cat "$body_file"
          echo
          rm -f "$body_file"
          if [[ ! "$http_code" =~ ^2[0-9][0-9]$ ]]; then
            echo "Social publishing worker returned HTTP $http_code; continuing."
            exit 1
          fi
