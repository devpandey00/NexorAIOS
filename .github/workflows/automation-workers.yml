name: Nexor realtime automation workers

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: nexor-realtime-workers
  cancel-in-progress: false

jobs:
  workers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run automatic campaign discovery
        env:
          NEXOR_BASE_URL: https://nexoraios-main-1.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET" || { echo 'CRON_SECRET is required'; exit 1; }
          body_file="$(mktemp)"
          echo "Running /api/campaigns/auto/run"
          http_code="$(curl --fail-with-body --silent --show-error --max-time 300 \
            -o "$body_file" -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$NEXOR_BASE_URL/api/campaigns/auto/run")"
          cat "$body_file"
          echo
          rm -f "$body_file"
          if [[ ! "$http_code" =~ ^2[0-9][0-9]$ ]]; then
            echo "Campaign discovery returned HTTP $http_code; refusing to treat redirect/error as success."
            exit 1
          fi

      - name: Run durable Nexor automation scheduler
        env:
          NEXOR_BASE_URL: https://nexoraios-main-1.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET" || { echo 'CRON_SECRET is required'; exit 1; }
          body_file="$(mktemp)"
          echo "Running /api/automations/run"
          http_code="$(curl --fail-with-body --silent --show-error --max-time 120 \
            -o "$body_file" -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -X POST \
            "$NEXOR_BASE_URL/api/automations/run")"
          cat "$body_file"
          echo
          rm -f "$body_file"
          if [[ ! "$http_code" =~ ^2[0-9][0-9]$ ]]; then
            echo "Automation scheduler returned HTTP $http_code; refusing to treat redirect/error as success."
            exit 1
          fi

      - name: Run due follow-ups, outreach and social posts
        env:
          NEXOR_BASE_URL: https://nexoraios-main-1.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET" || { echo 'CRON_SECRET is required'; exit 1; }
          test -n "$NEXOR_BASE_URL" || { echo 'NEXOR_BASE_URL is required'; exit 1; }

          call_worker() {
            local path="$1"
            local body_file
            body_file="$(mktemp)"
            echo "Running $path"
            http_code="$(curl --fail-with-body --silent --show-error --max-time 120 \
              -o "$body_file" -w '%{http_code}' \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$NEXOR_BASE_URL$path")"
            cat "$body_file"
            echo
            if [[ ! "$http_code" =~ ^2[0-9][0-9]$ ]]; then
              echo "Worker $path returned HTTP $http_code; refusing to treat redirect/error as success."
              rm -f "$body_file"
              exit 1
            fi
            rm -f "$body_file"
          }

          call_worker /api/cron/followups
          call_worker /api/cron/outreach
          call_worker /api/cron/social-publish
