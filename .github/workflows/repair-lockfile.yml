name: Repair Workspace Lockfile

# Lockfile repair commits are made by this workflow; ordinary source pushes
# still trigger the normal CI workflow so production builds stay validated.
on:
  push:
    branches:
      - main
      - claude/nexoraios-production-workflow
    paths:
      - 'package.json'
      - 'apps/api/package.json'
      - 'apps/web/package.json'
      - 'packages/*/package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/repair-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Lockfile already up to date.'
            exit 0
          fi
          git add pnpm-lock.yaml
          git commit -m 'chore: sync pnpm lockfile'
          git push
