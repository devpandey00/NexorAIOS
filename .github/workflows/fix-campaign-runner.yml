name: Fix Campaign Runner

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch malformed Prisma compound key
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/api/src/lib/campaign-runner.ts')
          s = p.read_text()
          old = 'campaignId_leadId: campaignId, leadId: lead.id'
          new = 'campaignId_leadId: { campaignId, leadId: lead.id }'
          if old not in s:
              print('Compound key already fixed; nothing to do.')
              raise SystemExit(0)
          p.write_text(s.replace(old, new))
          PY
          git diff --check
      - name: Commit and push fix when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/api/src/lib/campaign-runner.ts; then
            echo "No change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/lib/campaign-runner.ts
          git commit -m "fix: campaign runner compound key"
          git push origin main
